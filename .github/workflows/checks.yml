name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true  # external/phobos-modkit, the shared tools the scripts and the gate call
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      # The art tools' tests read and write images with Pillow. Pinned to the version on the owner's PC. The flag is needed because the
      # runner's Python refuses packages installed outside a virtual environment; this machine is thrown away after the run.
      - name: Install Pillow
        run: python3 -m pip install --break-system-packages pillow==12.3.0
      # The same gate as on the owner's PC (config/gate.json, phobos-modkit's gate): links, mod layout and text keys,
      # vehicle schemas, version copies, changelogs, the Python tests and every rule-test project under tests/, found by
      # glob so a new one is never left out. The mods' own builds are skipped: they reference other mods' assemblies
      # (Vanilla Expanded Framework's PipeSystem.dll, Vehicle Framework, Dubs Bad Hygiene, IRBM), which are not on NuGet
      # and may not be copied here (THIRD_PARTY_NOTICES.md). The rule tests compile their game-free sources themselves.
      - name: Run every check that needs no other mod (the gate, without the mod builds)
        run: python3 scripts/check-all.py --skip "build *" --keep-going
      # Only assemblies that reference nothing but the game and Harmony build here: the 1.7 reference (Krafs.Rimworld.Ref
      # 1.7 prerelease) and Harmony come from NuGet. RimWorld 1.7 only.
      - name: Build the assemblies that need no other mod's, for 1.7
        run: dotnet build src/PhobosFramework/PhobosFramework.csproj --nologo
