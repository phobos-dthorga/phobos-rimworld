name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check local documentation links
        run: python3 scripts/check-doc-links.py
      - name: Check the mods/ layout and About.xml files
        run: python3 scripts/check-mod-layout.py
      - name: Exercise the repository tooling
        run: python3 -m unittest discover -s tests -v
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x
      # The mod itself cannot build here: it references Vanilla Expanded Framework's PipeSystem.dll,
      # which its licence does not let us copy into the repository. The physics is game-free and runs.
      - name: Build and run the game-free physics tests
        run: dotnet test tests/PhobosRadio.Physics.Tests --nologo
      # D'thorga Factory Additions' assembly needs PipeSystem.dll too; its output rule is game-free.
      - name: Build and run the game-free factory rule tests
        run: dotnet test tests/PhobosFactory.Rules.Tests --nologo
      # D'thorga Medical Save Bridge's re-numbering and mod-list rules are game-free too.
      - name: Build and run the game-free medical save bridge rule tests
        run: dotnet test tests/PhobosMedicalSaveBridge.Rules.Tests --nologo
      # D'thorga Water Tap's assembly needs BadHygiene.dll; its rules are game-free.
      - name: Build and run the game-free water tap rule tests
        run: dotnet test tests/PhobosWaterTap.Rules.Tests --nologo
      # Mods that reference only the game, D'thorga Framework and Harmony build here too, for both game
      # versions: the 1.7 reference (Krafs.Rimworld.Ref 1.7 prerelease), the 1.6 one and Harmony come from NuGet.
      - name: Build the mods that need no other mod's assembly, for 1.7 and 1.6
        run: |
          dotnet build src/PhobosFramework/PhobosFramework.csproj --nologo
          dotnet build src/PhobosBurnsAndSmoke/PhobosBurnsAndSmoke.csproj --nologo
          dotnet build src/PhobosMedicalSaveBridge/PhobosMedicalSaveBridge.csproj --nologo
          dotnet build src/PhobosDosing/PhobosDosing.csproj --nologo
          dotnet build src/PhobosMedicalEquipment/PhobosMedicalEquipment.csproj --nologo
          dotnet build src/PhobosTriage/PhobosTriage.csproj --nologo
      # D'thorga Framework's gas-mixing, signal, mask and source rules are game-free.
      - name: Build and run the game-free framework rule tests
        run: dotnet test tests/PhobosFramework.Rules.Tests --nologo
      # D'thorga Burns and Smoke's burn load, shock, carbon monoxide and airway rules are game-free.
      - name: Build and run the game-free burns rule tests
        run: dotnet test tests/PhobosBurnsAndSmoke.Rules.Tests --nologo
      # D'thorga Emergency Dosing's effect, need, safety and choice rules are game-free.
      - name: Build and run the game-free dosing rule tests
        run: dotnet test tests/PhobosDosing.Rules.Tests --nologo
      # D'thorga Medical Equipment's oxygen need, fuel, status and choice rules are game-free.
      - name: Build and run the game-free medical equipment rule tests
        run: dotnet test tests/PhobosMedicalEquipment.Rules.Tests --nologo
      # D'thorga Triage's authority, condition class, operation choice and triage rules are game-free.
      - name: Build and run the game-free triage rule tests
        run: dotnet test tests/PhobosTriage.Rules.Tests --nologo
