name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check local documentation links
        run: python3 scripts/check-doc-links.py
      - name: Check the mods/ layout and About.xml files
        run: python3 scripts/check-mod-layout.py
      - name: Exercise the repository tooling
        run: python3 -m unittest discover -s tests -v
